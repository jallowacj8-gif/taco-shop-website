<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <style>
        a {
            color: blue;
        }
    </style>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="About LTS.html">About LTS</a></li>
                <li><a href="#menu">Our Menu</a></li>
                <li><a href="Store Hour.html">Store Hours</a></li>
            </ul>
        </nav>
          
        <figure>
            <img src="images/little tacos shop tacos.jpeg" width="400" height="300" alt="little tacos shop tacos"
            title="Tacos Ready To Eat!">
            <figcaption>
                Little Tacos Shop Tacos
            </figcaption>
        </figure>
    </header> 
    <hr>
    
    <main>
        <article id="contact">
    
            <h2>Our Contact Form</h2>
            <form action="https://httpbin.org/get" method="get">
                <fieldset>
                    <legend>Send Us A Message</legend>
                    <p>
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="name" placeholder="your name" required>
                    </p>
                    <p>
                        <label for="email">Email:</label>
                        <input type="text" name="email" id="email" placeholder="your email" required>
                    </p>
            
                    <p>
                        <legend>Your Message</legend>
                        <label for="message"></label>
                        <textarea name="message" id="message" cols="30"
                        rows="8" placeholder="type your message here"></textarea><br>
                    </p>
                </fieldset>

                <button value="send">Send</button>
                <button value="reset">Reset</button>
        
            </form>
        <article>
            <h2>Our Location</h2>
            <address>555 Tacos Temptation Lane, Suite T<br>Kamsas City, MO 55555-5555<br>
            <p>Phone:<a href="tel:+555-555-5555">555-555-5555</a></p></address>
          
            <p><a href="index.html">Back to Top</a></p> 
        </article> 
    </main>
    <hr> 
    <footer>
        <p>
            copyright &copy; The Little Taco Shop
        </p>
    </footer>    
</body>
</html>
